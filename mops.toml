[package]
name = "ic-agent"
version = "0.2.0"
description = "An Internet Computer agent in Motoko: sign, submit, poll and read canister calls, verifying every certificate and query signature. Runs off-chain (moxzi) or anywhere HTTPS outcalls exist."
repository = "https://github.com/icdevsorg/ic-agent-mo"
license = "Apache-2.0"
keywords = ["motoko", "moxzi", "agent", "internet-computer", "http"]

[dependencies]
base = "0.16.0"
cbor = "4.1.0"
sha2 = "0.2.5"
libsecp256k1 = "0.1.0"
bls12-381 = "0.1.0"

[toolchain]
moc = "1.16.1"
